# A second address for the same server: nadlanup-api.pages.dev. Some Israeli internet providers cannot look up
# *.workers.dev names (their DNS times out), so the site talks to the server through this Pages project, which hands
# every request to the Worker "nadlanup-api" over a service binding. No logic and no data here.
# Deploy (ISRU account):  cd server/edge && npx wrangler@4 pages deploy public --project-name nadlanup-api --branch main
name = "nadlanup-api"
pages_build_output_dir = "public"
compatibility_date = "2025-09-01"

[[services]]
binding = "API"
service = "nadlanup-api"
