    <script>
      // GitHub Pages SPA fallback: 404.html stores the requested path, restore it here.
      (function () {
        var p = sessionStorage.getItem('spa-path');
        if (p) {
          sessionStorage.removeItem('spa-path');
          history.replaceState(null, '', p);
        }
      })();
    </script>
