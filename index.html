<html lang="he" dir="rtl">

    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="%THEME_COLOR%" />

    <meta property="og:title" content="%OG_TITLE%" />
    <meta property="og:description" content="משרד תיווך ארצי, והקהילה החינמית מתווכים לעסקאות. 0% עמלה למשרד, 100% עמלה למתווך." />

    <meta name="twitter:image" content="%OG_IMAGE%" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="%BASE_URL%%FAVICON%" />
    <link rel="apple-touch-icon" href="%BASE_URL%%APPLE_ICON%" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&family=Frank+Ruhl+Libre:wght@400;500;700&family=Heebo:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script>
      // GitHub Pages SPA fallback: 404.html stores the requested path, restore it here.
      (function () {
        var p = sessionStorage.getItem('spa-path');
        if (p) {
          sessionStorage.removeItem('spa-path');
          history.replaceState(null, '', p);
        }
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="%ENTRY%"></script>
  </body>
